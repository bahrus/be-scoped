<!DOCTYPE html>
<html lang="en">

<body>
    <div id="scoped" be-scoped='{"count": 30}'></div>
    <script type=importmap>
        {
            "imports": {
                "be-enhanced/": "/node_modules/be-enhanced/",
                "be-hive/":  "/node_modules/be-hive/",
                "mount-observer/": "/node_modules/mount-observer/",
                "trans-render/": "/node_modules/trans-render/"
            }
        }
    </script>
    <script type=module>
        import '../behivior.js';
    </script>
    <script type="module">
        import {emc} from '../behivior.js'; 
        await customElements.whenDefined('be-enhanced');
        const beScoped = await scoped.beEnhanced.whenResolved(emc);
        beScoped.scope.addEventListener('count', e => {
            console.log(e.detail);
        });
        beScoped.scope.count = 31;
    </script>
