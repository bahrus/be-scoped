<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <!-- #include virtual="/imports.html" -->
     <script type=module>
        import '/emc.js';
     </script>
</head>
<body>
    <table itemscope=national-medal-list>
        <caption>Medal List Summer 2024</caption>
        <thead>
            <tr>
                <th></th>
                <th>Rank</th>
                <th>NOC</th>
                <th>Gold</th>
                <th>Silver</th>
                <th>Bronze</th>
                <th>Total</th>
            </tr>
        </thead>
        <tbody>
            <tr itemscope=country-medal-count -s=aria-rowindex>
                <td><plus-minus></plus-minus></td>
                <td itemprop=rank></td>
                <td itemprop=noc></td>
                <td itemprop=gold></td>
                <td itemprop=silver></td>
                <td itemprop=bronze></td>
                <td><span itemprop=total></span> of <span -o=totalMedalCount></span></td>
            </tr>
            <tr>
                <td be-scoped="country-medal-count national-medal-list" colspan=7>...</td>
            </tr>
        </tbody>
    </table>
</body>
</html>
